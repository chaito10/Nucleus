<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Converter</title>
<script type="application/nucleus+json">
{"id":"unit-converter","name":"Unit Converter","cat":"Data & Calculations","desc":"Length, mass, temperature, data units.","icon":"calc","w":560,"h":460}
</script>
<style>
:root{
  --accent:#4f8cff;
  --bg:#0b1220; --fg:#e8edf5; --muted:#9aa6bb;
  --panel:rgba(255,255,255,.06); --border:rgba(255,255,255,.12); --hover:rgba(255,255,255,.1);
  --radius:10px; --font:13px;
}
html[data-theme="light"]{
  --bg:#dfe7f3; --fg:#16202f; --muted:#5a6a82;
  --panel:rgba(0,0,0,.05); --border:rgba(0,0,0,.14); --hover:rgba(0,0,0,.07);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:var(--font);
  color:var(--fg);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);flex:0 0 auto}
header h1{font-size:14px;margin:0;font-weight:600}
main{flex:1;min-height:0;overflow:auto;padding:14px}
footer{flex:0 0 auto;padding:8px 14px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=number],input[type=text],select{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px;width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- app ---------- */
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cats .btn{padding:5px 10px;font-size:12px}
.cats .btn.on{border-color:var(--accent);background:var(--accent);color:#fff}
.conv{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.conv .cell{display:flex;flex-direction:column;gap:4px}
.conv label{font-size:12px;color:var(--muted)}
.swapBtn{grid-row:1/span 2;align-self:center;border-radius:50%;width:38px;height:38px;padding:0;font-size:16px}
.result{border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:4px;min-height:64px}
.result .big{font-size:22px;font-weight:700;word-break:break-all;font-variant-numeric:tabular-nums}
.opts{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12px}
.opts select{width:auto}
.quick{display:flex;flex-direction:column;gap:8px}
.quick h2{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills .btn{font-size:12px;padding:4px 9px}
.formula{font-size:12px}
table.all{width:100%;border-collapse:collapse;font-size:12px}
table.all td,table.all th{padding:3px 8px;border-bottom:1px dashed var(--border);text-align:right;font-variant-numeric:tabular-nums}
table.all th{text-align:right;color:var(--muted)}
table.all td:first-child,table.all th:first-child{text-align:left}
.allbox{max-height:220px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px}
@media (max-width:560px){.conv{grid-template-columns:1fr}.swapBtn{grid-row:auto;justify-self:center}}
</style>
</head>
<body>
<header><h1>Unit Converter</h1><span class="muted">Offline curated tables</span></header>
<main>
<div class="wrap">
  <div class="cats" id="cats" role="tablist" aria-label="Unit category"></div>
  <div class="conv">
    <div class="cell">
      <label for="fromSel">From</label>
      <select id="fromSel" aria-label="Source unit"></select>
      <input type="number" id="valIn" inputmode="decimal" value="1" aria-label="Value to convert">
    </div>
    <button class="btn swapBtn" id="swapBtn" aria-label="Swap source and target units">&#8646;</button>
    <div class="cell">
      <label for="toSel">To</label>
      <select id="toSel" aria-label="Target unit"></select>
      <div class="result" aria-live="polite">
        <div class="big" id="outBig">&mdash;</div>
        <div class="muted formula" id="outFormula"></div>
      </div>
    </div>
  </div>
  <div class="opts">
    <label>Precision
      <select id="precSel" aria-label="Result precision">
        <option value="auto" selected>Auto (up to 8 significant)</option>
        <option value="2">2 significant</option>
        <option value="4">4 significant</option>
        <option value="6">6 significant</option>
        <option value="fixed2">2 decimals</option>
      </select>
    </label>
    <span class="muted" id="catNote"></span>
  </div>
  <div class="quick">
    <h2>Common conversions</h2>
    <div class="pills" id="quickPills"></div>
  </div>
  <div class="quick">
    <h2 id="tblTitle">1 unit in every other unit</h2>
    <div class="allbox"><table class="all" id="allTbl"><thead><tr><th>Unit</th><th>Value</th></tr></thead><tbody></tbody></table></div>
  </div>
</div>
</main>
<footer><span class="muted" id="footNote">Runs offline. Data stays on this device.</span></footer>
<script>
"use strict";
/* ---------- Nucleus host integration (do not remove) ---------- */
(function(){
  var params=new URLSearchParams(location.search);
  function applyTheme(t,accent){
    if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;
    if(accent&&/^#[0-9a-f]{3,8}$/i.test(accent))document.documentElement.style.setProperty("--accent",accent);
  }
  applyTheme(params.get("n-theme"),params.get("n-accent"));
  try{applyTheme(localStorage.getItem("nucleus-app-theme"),localStorage.getItem("nucleus-app-accent"));}catch(e){}
  addEventListener("message",function(e){
    var d=e.data;
    if(d&&d.source==="nucleus-host"&&d.type==="theme"){
      applyTheme(d.theme,d.accent);
      try{localStorage.setItem("nucleus-app-theme",d.theme);localStorage.setItem("nucleus-app-accent",d.accent||"");}catch(err){}
    }});
  try{parent.postMessage({source:"nucleus-catalog",type:"ready"},"*");}catch(e){}
})();
/* ---------- Persistent state helper (in-memory fallback when sandboxed) ---------- */
var store=(function(){
  var mem={},ok=true;
  try{localStorage.setItem("__probe__","1");localStorage.removeItem("__probe__");}catch(e){ok=false;}
  return{
    persistent:ok,
    get:function(k,f){try{var v=localStorage.getItem("catapp-unit-converter-"+k);return v==null?f:JSON.parse(v);}catch(e){return mem[k]!==undefined?mem[k]:f;}},
    set:function(k,v){mem[k]=v;if(ok){try{localStorage.setItem("catapp-unit-converter-"+k,JSON.stringify(v));}catch(e){}}}
  };
})();
/* ---------- Unit tables ---------- */
/* Factor-based units: value_in_base = value * factor. Temperature uses formulas. */
var CATS={
  Length:{base:"m",note:"1 in = 2.54 cm exactly.",units:{
    nm:["Nanometre",1e-9],mm:["Millimetre",.001],cm:["Centimetre",.01],m:["Metre",1],km:["Kilometre",1000],
    in:["Inch",.0254],ft:["Foot",.3048],yd:["Yard",.9144],mi:["Mile",1609.344],nmi:["Nautical mile",1852]
  },quick:[["km","mi"],["mi","km"],["in","cm"],["ft","m"],["cm","in"]]},
  Mass:{base:"kg",note:"avoirdupois; US ton = short ton.",units:{
    mg:["Milligram",1e-6],g:["Gram",.001],kg:["Kilogram",1],t:["Tonne",1000],
    oz:["Ounce",.028349523125],lb:["Pound",.45359237],st:["Stone",6.35029318],
    tonUS:["Ton (US, short)",907.18474],tonUK:["Ton (UK, long)",1016.0469088]
  },quick:[["kg","lb"],["lb","kg"],["kg","st"],["g","oz"]]},
  Temperature:{base:"degC",temp:true,note:"Formulas: F = C x 9/5 + 32 ; K = C + 273.15 (not a linear scale shortcut).",units:{
    C:["Celsius",1],F:["Fahrenheit",1],K:["Kelvin",1],R:["Rankine",1]
  },quick:[["C","F"],["F","C"],["C","K"],["K","C"]]},
  Time:{base:"s",note:"Month = 30 d, Year = 365 d (approximate).",units:{
    ms:["Millisecond",.001],s:["Second",1],min:["Minute",60],h:["Hour",3600],day:["Day",86400],
    week:["Week",604800],month:["Month (30 d)",2592000],year:["Year (365 d)",31536000]
  },quick:[["h","min"],["day","h"],["min","s"],["week","day"]]},
  Data:{base:"B",note:"SI prefixes are x1000 (KB, MB...); IEC prefixes are x1024 (KiB, MiB...). 1 byte = 8 bits.",units:{
    bit:["Bit (b)",0.125],B:["Byte (B)",1],
    kB:["Kilobyte (KB, x1000)",1e3],KiB:["Kibibyte (KiB, x1024)",1024],
    MB:["Megabyte (MB, x1000)",1e6],MiB:["Mebibyte (MiB, x1024)",1048576],
    GB:["Gigabyte (GB, x1000)",1e9],GiB:["Gibibyte (GiB, x1024)",1073741824],
    TB:["Terabyte (TB, x1000)",1e12],TiB:["Tebibyte (TiB, x1024)",1099511627776],
    PB:["Petabyte (PB, x1000)",1e15],PiB:["Pebibyte (PiB, x1024)",1125899906842624],
    EB:["Exabyte (EB, x1000)",1e18],EiB:["Exbibyte (EiB, x1024)",1152921504606846976],
    ZB:["Zettabyte (ZB, x1000)",1e21],ZiB:["Zebibyte (ZiB, x1024)",1180591620717411303424],
    YB:["Yottabyte (YB, x1000)",1e24],YiB:["Yobibyte (YiB, x1024)",1208925819614629174706176]
  },quick:[["MB","MiB"],["GB","GiB"],["bit","B"],["KiB","kB"]]},
  Speed:{base:"m/s",note:"1 mph = 1.609344 km/h exactly.",units:{
    "m/s":["Metres per second",1],"km/h":["Kilometres per hour",1/3.6],
    "mph":["Miles per hour",0.44704],"ft/s":["Feet per second",0.3048],
    knot:["Knot (nmi/h)",1852/3600],"mach":["Mach (sea level, approx.)",340.29]
  },quick:[["km/h","mph"],["mph","km/h"],["m/s","km/h"],["knot","km/h"]]},
  Area:{base:"m2",note:"ha = hectare.",units:{
    mm2:["Square millimetre",1e-6],cm2:["Square centimetre",1e-4],m2:["Square metre",1],
    ha:["Hectare",1e4],km2:["Square kilometre",1e6],
    in2:["Square inch",0.00064516],ft2:["Square foot",0.09290304],yd2:["Square yard",0.83612736],
    acre:["Acre",4046.8564224],mi2:["Square mile",2589988.110336]
  },quick:[["m2","ft2"],["acre","ha"],["km2","mi2"]]},
  Volume:{base:"m3",note:"US customary unless marked Imp; 1 L = 0.001 m3.",units:{
    cm3:["Cubic centimetre (mL)",1e-6],dm3:["Cubic decimetre (L)",1e-3],m3:["Cubic metre",1],
    L:["Litre",1e-3],mL:["Millilitre",1e-6],
    in3:["Cubic inch",1.6387064e-5],ft3:["Cubic foot",0.028316846592],yd3:["Cubic yard",0.764554857984],
    galUS:["Gallon (US)",3.785411784e-3],qtUS:["Quart (US)",9.46352946e-4],
    ptUS:["Pint (US)",4.73176473e-4],cupUS:["Cup (US)",2.365882365e-4],
    flozUS:["Fluid ounce (US)",2.95735295625e-5],tbsp:["Tablespoon (US)",1.478676478e-5],
    tsp:["Teaspoon (US)",4.928921594e-6],galImp:["Gallon (Imp)",4.54609e-3]
  },quick:[["L","galUS"],["galUS","L"],["mL","flozUS"],["ft3","m3"]]},
  Energy:{base:"J",note:"cal = thermochemical (4.184 J); Wh = 3600 J.",units:{
    J:["Joule",1],kJ:["Kilojoule",1e3],MJ:["Megajoule",1e6],
    cal:["Calorie (thermochemical)",4.184],kcal:["Kilocalorie (food Cal)",4184],
    Wh:["Watt-hour",3600],kWh:["Kilowatt-hour",3.6e6],
    BTU:["British thermal unit",1055.05585262],eV:["Electronvolt",1.602176634e-19]
  },quick:[["kWh","MJ"],["kcal","kJ"],["BTU","kJ"]]}
};
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var state=store.get("ui",{cat:"Length",from:null,to:null,val:1,prec:"auto"});
  var cat=CATS[state.cat]?state.cat:"Length";

  function toBase(id,v){var u=CATS[cat].units[id];return v*u[1];}
  function fromBase(id,b){var u=CATS[cat].units[id];return b/u[1];}
  /* real temperature formulas via Celsius */
  function tempToC(id,v){
    if(id==="C")return v;
    if(id==="F")return (v-32)*5/9;
    if(id==="K")return v-273.15;
    if(id==="R")return (v-491.67)*5/9;
    return v;
  }
  function tempFromC(id,c){
    if(id==="C")return c;
    if(id==="F")return c*9/5+32;
    if(id==="K")return c+273.15;
    if(id==="R")return (c+273.15)*9/5;
    return c;
  }
  function convert(fromId,toId,v){
    if(CATS[cat].temp)return tempFromC(toId,tempToC(fromId,v));
    return fromBase(toId,toBase(fromId,v));
  }
  function fmt(x){
    if(!isFinite(x))return "—";
    var p=state.prec;
    if(p==="fixed2")return x.toFixed(2);
    if(p==="auto"){
      var a=Math.abs(x);
      if(a!==0&&(a<1e-6||a>=1e12))return x.toExponential(4);
      return String(Number(x.toPrecision(8)));
    }
    return String(Number(x.toPrecision(parseInt(p,10)||6)));
  }
  function fillSelects(){
    var units=CATS[cat].units,ids=Object.keys(units);
    var f=$("fromSel"),t=$("toSel");
    [f,t].forEach(function(sel){
      sel.textContent="";
      ids.forEach(function(id){
        var o=document.createElement("option");
        o.value=id;o.textContent=units[id][0]+" ("+id+")";
        sel.appendChild(o);
      });
    });
    if(!ids.includes(state.from))state.from=ids[0];
    if(!ids.includes(state.to))state.to=ids[1]||ids[0];
    f.value=state.from;t.value=state.to;
  }
  function renderQuick(){
    var q=$("quickPills");q.textContent="";
    CATS[cat].quick.forEach(function(pair){
      var b=document.createElement("button");
      b.className="btn";
      b.textContent=CATS[cat].units[pair[0]][0].split(" (")[0]+" → "+CATS[cat].units[pair[1]][0].split(" (")[0];
      b.setAttribute("aria-label","Set conversion "+pair[0]+" to "+pair[1]);
      b.addEventListener("click",function(){
        state.from=pair[0];state.to=pair[1];$("fromSel").value=pair[0];$("toSel").value=pair[1];
        if(!parseFloat($("valIn").value)&&$("valIn").value!=="1")$("valIn").value="1";
        state.val=$("valIn").value===""?1:state.val;update();
      });
      q.appendChild(b);
    });
  }
  function renderTable(){
    var tb=$("allTbl").querySelector("tbody");tb.textContent="";
    var v=parseFloat($("valIn").value);if(isNaN(v))v=0;
    var fromId=$("fromSel").value,units=CATS[cat].units;
    Object.keys(units).forEach(function(id){
      var tr=document.createElement("tr");
      var c1=document.createElement("td");c1.textContent=units[id][0];
      var c2=document.createElement("td");c2.textContent=fmt(convert(fromId,id,v));
      tr.appendChild(c1);tr.appendChild(c2);tb.appendChild(tr);
    });
  }
  function renderCats(){
    var box=$("cats");box.textContent="";
    Object.keys(CATS).forEach(function(name){
      var b=document.createElement("button");
      b.className="btn";b.textContent=name;b.setAttribute("role","tab");
      b.setAttribute("aria-selected",name===cat?"true":"false");
      if(name===cat)b.classList.add("on");
      b.addEventListener("click",function(){
        cat=name;state.cat=name;$("catNote").textContent=CATS[name].note;
        renderCats();fillSelects();renderQuick();update();store.set("ui",state);
      });
      box.appendChild(b);
    });
  }
  function update(){
    var v=parseFloat($("valIn").value);
    state.from=$("fromSel").value;state.to=$("toSel").value;
    state.val=isNaN(v)?null:v;
    $("outBig").textContent=isNaN(v)?"Enter a number":fmt(v)+" "+CATS[cat].units[state.to][0].replace(/ \(.*\)/,"");
    $("outFormula").textContent=isNaN(v)?"":fmt(v)+" "+CATS[cat].units[state.from][0].replace(/ \(.*\)/,"")+"  =  "+fmt(convert(state.from,state.to,v))+" "+CATS[cat].units[state.to][0].replace(/ \(.*\)/,"");
    renderTable();
    store.set("ui",state);
  }
  $("fromSel").addEventListener("change",update);
  $("toSel").addEventListener("change",update);
  $("valIn").addEventListener("input",update);
  $("precSel").addEventListener("change",function(){state.prec=$("precSel").value;update();});
  $("swapBtn").addEventListener("click",function(){
    var a=state.from;state.from=state.to;state.to=a;
    $("fromSel").value=state.from;$("toSel").value=state.to;update();
  });
  if(!store.persistent){$("footNote").textContent="Session only — preferences are not persisted inside Nucleus (sandboxed frame). Runs offline.";}
  $("catNote").textContent=CATS[cat].note;
  $("precSel").value=state.prec||"auto";
  $("valIn").value=state.val==null?1:state.val;
  renderCats();fillSelects();renderQuick();update();
})();
</script>
</body>
</html>
