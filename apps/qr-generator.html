<!DOCTYPE html>
<!--
  Nucleus catalogue app: QR Generator.
  Self-contained offline single file. Contract: apps/CATALOG.md.
  QR encoder implemented from scratch: byte mode (UTF-8), versions 1-10, ECC L/M/Q/H,
  Reed-Solomon over GF(256) (primitive polynomial x^8+x^4+x^3+x^2+1 = 0x11D),
  8 masks + ISO/IEC 18004 penalty evaluation, BCH format info (G=0x537, mask 0x5412),
  BCH version info for v7-v10 (G=0x1F25).
-->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Generator</title>
<script type="application/nucleus+json">
{"id":"qr-generator","name":"QR Generator","cat":"Media & Files","desc":"Generate QR codes offline.","icon":"wallpaper","w":640,"h":560}
</script>
<style>

}

  --bg:#dfe7f3; --fg:#16202f; --muted:#5a6a82;
  --panel:rgba(0,0,0,.05); --border:rgba(0,0,0,.14); --hover:rgba(0,0,0,.07);
  --ok:#1a8f5c; --bad:#b3403f;
}

html,body{height:100%;margin:0}

header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);flex:0 0 auto;flex-wrap:wrap}

button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

<body>
<header><h1>QR Generator</h1><span class="muted">Byte mode, versions 1&ndash;10, fully offline</span></header>
<main>
  <div class="col">
    <label for="qr-text">Text or URL (encoded as UTF-8 bytes)
      <textarea id="qr-text" spellcheck="false" placeholder="Text or URL to encode">example.com</textarea>
    </label>
    <div class="row">
      <label for="ecc">Error correction
        <select id="ecc">
          <option value="0">L (~7%)</option>
          <option value="1" selected>M (~15%)</option>
          <option value="2">Q (~25%)</option>
          <option value="3">H (~30%)</option>
        </select>
      </label>
      <label for="msize">Module size <span id="msize-val">6</span> px
        <input type="range" id="msize" min="2" max="12" step="1" value="6" aria-label="Module size in pixels">
      </label>
    </div>
    <div class="row">
      <label><input type="checkbox" id="quiet" checked> Quiet zone (4 modules)</label>
    </div>
    <div class="row">
      <button class="btn primary" id="dl" type="button">Download PNG</button>
      <button class="btn" id="copy" type="button">Copy PNG</button>
    </div>
    <div id="msg" aria-live="polite"></div>
  </div>
  <div class="preview">
    <div id="canvas-wrap"><canvas id="cv" width="0" height="0" role="img" aria-label="Generated QR code preview"></canvas></div>
    <div id="status" class="muted" aria-live="polite"></div>
  </div>
</main>
<footer><span class="muted" id="foot">Runs offline. Encoding done locally: byte mode only, max version 10 (size 57&times;57 modules). Data stays on this device.</span></footer>
<script>

    }});
  try{parent.postMessage({source:"nucleus-catalog",type:"ready"},"*");}catch(e){}
})();
/* ---------- Persistent state helper (in-memory fallback when sandboxed) ---------- */
var store=(function(){
  var mem={},ok=true;
  try{localStorage.setItem("__probe__","1");localStorage.removeItem("__probe__");}catch(e){ok=false;}
  return{
    persistent:ok,
    get:function(k,f){try{var v=localStorage.getItem("catapp-qr-generator-"+k);return v==null?f:JSON.parse(v);}catch(e){return mem[k]!==undefined?mem[k]:f;}},
    set:function(k,v){mem[k]=v;if(ok){try{localStorage.setItem("catapp-qr-generator-"+k,JSON.stringify(v));}catch(e){}}}
  };
})();
/* ================= QR encoder (from scratch) ================= */
/* GF(256) tables, primitive polynomial 0x11D */
var EXP=new Uint8Array(512),LOG=new Uint8Array(256);
(function(){var x=1;for(var i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&0x100)x^=0x11D;}
  for(var j=255;j<512;j++)EXP[j]=EXP[j-255];})();
function gfMul(a,b){return(a&&b)?EXP[LOG[a]+LOG[b]]:0;}
/* generator polynomial of degree deg, product of (x - alpha^i), i=0..deg-1 */
function rsGenPoly(deg){
  var g=[1];
  for(var i=0;i<deg;i++){
    var ng=new Array(g.length+1).fill(0);
    for(var j=0;j<g.length;j++){
      ng[j]^=g[j];                       /* x * term */
      ng[j+1]^=gfMul(g[j],EXP[i]);       /* alpha^i * term */
    }
    g=ng;
  }
  return g;
}
function rsEncode(data,deg){
  var gen=rsGenPoly(deg),res=new Array(deg).fill(0);
  for(var i=0;i<data.length;i++){
    var factor=data[i]^res[0];
    res.shift();res.push(0);
    if(factor)for(var j=0;j<deg;j++)res[j]^=gfMul(gen[j+1],factor);
  }
  return res;
}
/* Block table: [v-1][eccIdx] = [eccCodewordsPerBlock, blocksGroup1, dataCwGroup1, blocksGroup2, dataCwGroup2]
   Totals verified against codeword counts 26,44,70,100,134,172,196,242,292,346 for versions 1-10. */
var BLOCKS=[
[[7,1,19,0,0],[10,1,16,0,0],[13,1,13,0,0],[17,1,9,0,0]],
[[10,1,34,0,0],[16,1,28,0,0],[22,1,22,0,0],[28,1,16,0,0]],
[[15,1,55,0,0],[26,1,44,0,0],[18,2,17,0,0],[22,2,13,0,0]],
[[20,1,80,0,0],[18,2,32,0,0],[26,2,24,0,0],[16,4,9,0,0]],
[[26,1,108,0,0],[24,2,43,0,0],[18,2,15,2,16],[22,2,11,2,12]],
[[18,2,68,0,0],[16,4,27,0,0],[24,4,19,0,0],[28,4,15,0,0]],
[[20,2,78,0,0],[18,4,31,0,0],[18,2,14,4,15],[26,4,13,1,14]],
[[24,2,97,0,0],[22,2,38,2,39],[22,4,18,2,19],[26,4,14,2,15]],
[[30,2,116,0,0],[22,3,36,2,37],[20,4,16,4,17],[24,4,12,4,13]],
[[18,2,68,2,69],[26,4,43,1,44],[24,6,19,2,20],[28,6,15,2,16]]

var ECC_NAMES=["L","M","Q","H"],ECC_BITS=[0b01,0b00,0b11,0b10];
var ALIGN=[[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]];
var TOTAL_CW=[26,44,70,100,134,172,196,242,292,346];
function dataCw(v,e){var b=BLOCKS[v-1][e];return b[1]*b[2]+b[3]*b[4];}

function capacity(v,e){return Math.floor((dataCw(v,e)*8-headerBits(v))/8);}
function pickVersion(len,e){
  for(var v=1;v<=10;v++)if(capacity(v,e)>=len)return v;

function bchFormat(d5){var v=d5<<10;for(var i=14;i>=10;i--)if((v>>>i)&1)v^=0x537<<(i-10);return((d5<<10)|v)^0x5412;}
function bchVersion(ver){var v=ver<<12;for(var i=17;i>=12;i--)if((v>>>i)&1)v^=0x1F25<<(i-12);return(ver<<12)|v;}
function makeBitList(bytes,v,e){
  var dCw=dataCw(v,e),bits=[];
  function push(val,n){for(var i=n-1;i>=0;i--)bits.push((val>>>i)&1);}
  push(4,4);                      /* byte mode indicator 0100 */
  push(bytes.length,v<=9?8:16);   /* character count */
  for(var i=0;i<bytes.length;i++)push(bytes[i],8);

function interleave(bytes,v,e){
  var spec=BLOCKS[v-1][e],ec=spec[0],groups=[];
  function mk(n,k){var out=[];for(var i=0;i<n;i++)out.push({d:null,e:null,len:k});return out;}
  var g=mk(spec[1],spec[2]);Array.prototype.push.apply(g,mk(spec[3],spec[4]));
  var off=0;
  for(var i=0;i<g.length;i++){g[i].d=bytes.slice(off,off+g[i].len);off+=g[i].len;}
  for(i=0;i<g.length;i++)g[i].e=rsEncode(g[i].d,ec);
  var out=[],maxD=Math.max(spec[2],spec[4]);
  for(i=0;i<maxD;i++)for(var j=0;j<g.length;j++)if(i<g[j].d.length)out.push(g[j].d[i]);
  for(i=0;i<ec;i++)for(j=0;j<g.length;j++)out.push(g[j].e[i]);

/* mask functions, r=row c=col, true = invert */
var MASKS=[
 function(r,c){return(r+c)%2===0;},
 function(r,c){return r%2===0;},
 function(r,c){return c%3===0;},
 function(r,c){return(r+c)%3===0;},
 function(r,c){return(Math.floor(r/2)+Math.floor(c/3))%2===0;},
 function(r,c){var p=r*c;return p%2+p%3===0;},
 function(r,c){var p=r*c;return(p%2+p%3)%2===0;},

  if(!v)throw new Error("too-long");

  var fn=[],fnV=[],res=[];
  for(i=0;i<size;i++){fn.push(new Uint8Array(size));fnV.push(new Uint8Array(size));res.push(new Uint8Array(size));}
  function setFn(r,c,v1){if(r>=0&&c>=0&&r<size&&c<size&&!fn[r][c]){fn[r][c]=1;fnV[r][c]=v1;}}

  function finder(r0,c0){
    for(var r=-1;r<=7;r++)for(var c=-1;c<=7;c++){
      var rr=r0+r,cc=c0+c;if(rr<0||cc<0||rr>=size||cc>=size)continue;
      var dark=(r>=0&&r<=6&&(c===0||c===6))||(c>=0&&c<=6&&(r===0||r===6))||(r>=2&&r<=4&&c>=2&&c<=4);
      setFn(rr,cc,dark?1:0);

  }
  finder(0,0);finder(0,size-7);finder(size-7,0);
  setFn(size-8,8,1); /* dark module */
  /* alignment before timing: a pattern centred on the timing line owns those modules */
  var ac=ALIGN[v-1];
  for(var ai=0;ai<ac.length;ai++)for(var bi=0;bi<ac.length;bi++){
    var r=ac[ai],c=ac[bi];
    if(fn[r]&&fn[r][c])continue; /* overlaps finder */
    for(var dr=-2;dr<=2;dr++)for(var dc=-2;dc<=2;dc++)
      setFn(r+dr,c+dc,(Math.max(Math.abs(dr),Math.abs(dc))!==1)?1:0);
  }
  /* timing patterns (skip modules already used by an alignment pattern) */
  for(i=8;i<size-8;i++){setFn(6,i,i%2===0?1:0);setFn(i,6,i%2===0?1:0);}
  /* reserve format areas */
  for(i=0;i<=8;i++){if(!fn[8][i]){setFn(8,i,0);}if(!fn[i][8]){setFn(i,8,0);}}
  for(i=0;i<8;i++){setFn(8,size-1-i,0);setFn(size-1-i,8,0);}

    /* extract payload */
    var bits=[];for(i2=0;i2<g.length;i2++)for(var q=0;q<g[i2].d.length*8;q++)bits.push((g[i2].d[q>>3]>>(7-(q&7)))&1);
    var mode=(bits[0]<<3)|(bits[1]<<2)|(bits[2]<<1)|bits[3];
    var nLen=v<=9?8:16,len=0;
    for(i2=4;i2<4+nLen;i2++)len=(len<<1)|bits[i2];
    var out=[];
    for(i2=0;i2<len;i2++){var b2=0;for(j2=0;j2<8;j2++)b2=(b2<<1)|bits[4+nLen+i2*8+j2];out.push(b2);}
    return{text:new TextDecoder("utf-8").decode(new Uint8Array(out)),mode:mode,len:len,syndromeFails:bad,dataCw:dataCw(v,eIdx)};
  };
}
/* ================= rendering ================= */
function drawCv(qr){
  var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
  var ms=parseInt(document.getElementById("msize").value,10);
  var qz=document.getElementById("quiet").checked?4:0;
  var dim=(qr.size+qz*2)*ms;
  cv.width=dim;cv.height=dim;
  ctx.fillStyle="#ffffff";ctx.fillRect(0,0,dim,dim);
  ctx.fillStyle="#000000";
  for(var r=0;r<qr.size;r++)for(var c=0;c<qr.size;c++)
    if(qr.modules[r][c])ctx.fillRect((c+qz)*ms,(r+qz)*ms,ms,ms);
}
var lastQR=null;
function setStatus(txt,cls){
  var s=document.getElementById("status");
  s.textContent=txt;s.className=cls||"";
}
function setMsg(txt){document.getElementById("msg").textContent=txt;}
function regenerate(){
  var text=document.getElementById("qr-text").value;
  var eIdx=parseInt(document.getElementById("ecc").value,10);
  var bytes=new TextEncoder().encode(text);
  if(bytes.length===0){lastQR=null;setStatus("Enter text or a URL to encode.","");document.getElementById("dl").disabled=true;document.getElementById("copy").disabled=true;return;}
  try{
    var qr=new QR(text,bytes,eIdx);
    lastQR=qr;drawCv(qr);
    setStatus("v"+qr.version+" · "+qr.ecc+" · "+qr.size+"×"+qr.size+" modules · mask "+qr.mask+" · "+bytes.length+" byte(s) (cap "+capacity(qr.version,eIdx)+")","ok");
    document.getElementById("dl").disabled=false;document.getElementById("copy").disabled=false;
  }catch(err){
    lastQR=null;setStatus(err.message==="too-long"?
      "Too long: "+bytes.length+" UTF-8 bytes exceed the maximum (version 10, level "+ECC_NAMES[eIdx]+") capacity of "+capacity(10,eIdx)+" bytes. Shorten the text or choose level L.":"Encoding error: "+err.message,"err");
    document.getElementById("dl").disabled=true;document.getElementById("copy").disabled=true;
    var cv=document.getElementById("cv"),ctx=cv.getContext("2d");cv.width=170;cv.height=170;ctx.fillStyle="#fff";ctx.fillRect(0,0,170,170);
  }
}
function downloadPng(){
  if(!lastQR)return;
  var cv=document.getElementById("cv");
  cv.toBlob(function(blob){
    if(!blob){setMsg("Could not create PNG blob.");return;}
    var url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download="qr-v"+lastQR.version+"-"+lastQR.ecc+".png";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},5000);
    setMsg("PNG downloaded.");
  },"image/png");
}
function copyPng(){
  if(!lastQR)return;
  if(!(navigator.clipboard&&window.ClipboardItem)){setMsg("Clipboard image copy is not supported in this browser/context.");return;}
  var cv=document.getElementById("cv");
  cv.toBlob(function(blob){
    if(!blob){setMsg("Could not create PNG blob.");return;}
    navigator.clipboard.write([new ClipboardItem({"image/png":blob})]).then(
      function(){setMsg("PNG copied to clipboard.");},
      function(){setMsg("Clipboard write blocked (needs a user gesture and permission).");});
  },"image/png");
}
function init(){
  var sv=store.get("settings",null);
  if(sv){
    if(typeof sv.ecc==="number")document.getElementById("ecc").value=String(sv.ecc);
    if(sv.msize)document.getElementById("msize").value=String(sv.msize);
    if(typeof sv.quiet==="boolean")document.getElementById("quiet").checked=sv.quiet;
  }
  function save(){
    store.set("settings",{ecc:parseInt(document.getElementById("ecc").value,10),
      msize:parseInt(document.getElementById("msize").value,10),
      quiet:document.getElementById("quiet").checked});
  }
  document.getElementById("qr-text").addEventListener("input",regenerate);
  document.getElementById("ecc").addEventListener("change",function(){regenerate();save();});
  document.getElementById("msize").addEventListener("input",function(){
    document.getElementById("msize-val").textContent=this.value;
    if(lastQR)drawCv(lastQR);save();
  });
  document.getElementById("quiet").addEventListener("change",function(){if(lastQR)drawCv(lastQR);save();});
  document.getElementById("dl").addEventListener("click",downloadPng);
  document.getElementById("copy").addEventListener("click",copyPng);
  document.getElementById("msize-val").textContent=document.getElementById("msize").value;
  if(!store.persistent){
    var f=document.getElementById("foot");
    f.textContent=f.textContent+" Preferences are session only, not persisted (embedded sandbox).";
  }
  regenerate();
}
init();
if(typeof module!=="undefined")module.exports={QR:QR,BLOCKS:BLOCKS,capacity:capacity,dataCw:dataCw,rsEncode:rsEncode,rsGenPoly:rsGenPoly,bchVersion:bchVersion,bchFormat:bchFormat,ECC_NAMES:ECC_NAMES,TOTAL_CW:TOTAL_CW,gfMul:gfMul,EXP:EXP,LOG:LOG};
</script>
