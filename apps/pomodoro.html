<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Timer</title>
<script type="application/nucleus+json">
{"id":"pomodoro","name":"Pomodoro Timer","cat":"Productivity","desc":"Focus timer with break cycles.","icon":"tasks","w":460,"h":520}
</script>
<style>
:root{
  --accent:#4f8cff;
  --bg:#0b1220; --fg:#e8edf5; --muted:#9aa6bb;
  --panel:rgba(255,255,255,.06); --border:rgba(255,255,255,.12); --hover:rgba(255,255,255,.1);
  --radius:10px; --font:13px;
}
html[data-theme="light"]{
  --bg:#dfe7f3; --fg:#16202f; --muted:#5a6a82;
  --panel:rgba(0,0,0,.05); --border:rgba(0,0,0,.14); --hover:rgba(0,0,0,.07);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:var(--font);
  color:var(--fg);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);flex:0 0 auto}
header h1{font-size:14px;margin:0;font-weight:600}
main{flex:1;min-height:0;overflow:auto;padding:14px}
footer{flex:0 0 auto;padding:8px 14px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{border-color:var(--accent);background:var(--accent);color:#fff}
input[type=number],input[type=text],select{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- app ---------- */
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs .btn{flex:1;min-width:90px;padding:6px 4px;font-size:12px}
.ringbox{display:flex;justify-content:center;padding:4px 0}
svg.ring{width:min(220px,60vw);height:min(220px,60vw)}
.ring-bg{fill:none;stroke:var(--border);stroke-width:10}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.time{font-variant-numeric:tabular-nums;font-weight:700}
.ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ctl .btn{min-width:88px}
.bignum{position:absolute;font-size:26px}
.ringlabel{position:relative;display:flex;align-items:center;justify-content:center}
.ringlabel>div{position:absolute;text-align:center}
.card{border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.card h2{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.fields label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.fields input{width:100%}
.checks{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;align-items:center}
.checks label{display:flex;gap:5px;align-items:center;cursor:pointer}
.log{max-height:180px;overflow:auto;margin:0;padding:0;list-style:none;font-size:12px}
.log li{display:flex;justify-content:space-between;gap:8px;padding:4px 2px;border-bottom:1px dashed var(--border)}
.log .k{color:var(--muted)}
.badge{border:1px solid var(--border);border-radius:99px;padding:1px 8px;font-size:11px;color:var(--muted)}
@media (max-width:420px){.tabs .btn{min-width:70px}}
</style>
</head>
<body>
<header><h1>Pomodoro Timer</h1><span class="muted">Focus cycles with breaks</span></header>
<main>
<div class="wrap">
  <div class="tabs" role="tablist" aria-label="Timer phase">
    <button class="btn" id="tab-focus" data-mode="focus" role="tab" aria-selected="true">Focus</button>
    <button class="btn" id="tab-short" data-mode="short" role="tab" aria-selected="false">Short break</button>
    <button class="btn" id="tab-long" data-mode="long" role="tab" aria-selected="false">Long break</button>
  </div>
  <div class="ringbox">
    <div class="ringlabel">
      <svg class="ring" viewBox="0 0 200 200" role="img" aria-label="Phase progress ring">
        <circle class="ring-bg" cx="100" cy="100" r="88"></circle>
        <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="88" transform="rotate(-90 100 100)"></circle>
      </svg>
      <div>
        <div class="time" id="timeText" style="font-size:34px" aria-live="polite">25:00</div>
        <div class="muted" id="phaseName">Focus</div>
        <div class="muted" id="cycleText">Cycle 0 of 4</div>
      </div>
    </div>
  </div>
  <div class="ctl">
    <button class="btn primary" id="startBtn" aria-label="Start or pause timer">Start</button>
    <button class="btn" id="resetBtn">Reset</button>
    <button class="btn" id="skipBtn" aria-label="Finish this phase early">Skip &#9197;</button>
  </div>
  <div class="card">
    <h2>Durations (minutes)</h2>
    <div class="fields">
      <label>Focus <input type="number" id="inFocus" min="1" max="180" inputmode="numeric"></label>
      <label>Short break <input type="number" id="inShort" min="1" max="60" inputmode="numeric"></label>
      <label>Long break <input type="number" id="inLong" min="1" max="120" inputmode="numeric"></label>
      <label>Long-break every <input type="number" id="inInterval" min="2" max="12" inputmode="numeric"></label>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="ckSound"> Sound</label>
      <label><input type="checkbox" id="ckSpeech"> Voice announce</label>
      <label><input type="checkbox" id="ckFlash"> Flash title</label>
      <span class="badge" id="todayCount">0 focus today</span>
    </div>
  </div>
  <div class="card">
    <h2>Today's sessions</h2>
    <ul class="log" id="logList"></ul>
    <div class="row">
      <button class="btn" id="clearLogBtn" aria-label="Clear today's session log">Clear log</button>
      <span class="muted" id="logNote"></span>
    </div>
  </div>
</div>
</main>
<footer><span class="muted" id="footNote">Runs offline. Data stays on this device.</span></footer>
<script>
"use strict";
/* ---------- Nucleus host integration (do not remove) ---------- */
(function(){
  var params=new URLSearchParams(location.search);
  function applyTheme(t,accent){
    if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;
    if(accent&&/^#[0-9a-f]{3,8}$/i.test(accent))document.documentElement.style.setProperty("--accent",accent);
  }
  applyTheme(params.get("n-theme"),params.get("n-accent"));
  try{applyTheme(localStorage.getItem("nucleus-app-theme"),localStorage.getItem("nucleus-app-accent"));}catch(e){}
  addEventListener("message",function(e){
    var d=e.data;
    if(d&&d.source==="nucleus-host"&&d.type==="theme"){
      applyTheme(d.theme,d.accent);
      try{localStorage.setItem("nucleus-app-theme",d.theme);localStorage.setItem("nucleus-app-accent",d.accent||"");}catch(err){}
    }});
  try{parent.postMessage({source:"nucleus-catalog",type:"ready"},"*");}catch(e){}
})();
/* ---------- Persistent state helper (in-memory fallback when sandboxed) ---------- */
var store=(function(){
  var mem={},ok=true;
  try{localStorage.setItem("__probe__","1");localStorage.removeItem("__probe__");}catch(e){ok=false;}
  return{
    persistent:ok,
    get:function(k,f){try{var v=localStorage.getItem("catapp-pomodoro-"+k);return v==null?f:JSON.parse(v);}catch(e){return mem[k]!==undefined?mem[k]:f;}},
    set:function(k,v){mem[k]=v;if(ok){try{localStorage.setItem("catapp-pomodoro-"+k,JSON.stringify(v));}catch(e){}}}
  };
})();
/* ---------- Pomodoro logic (timestamp-based; safe when tab hidden) ---------- */
(function(){
  var $=function(id){return document.getElementById(id);};
  var MODES={focus:"Focus",short:"Short break",long:"Long break"};
  var settings=store.get("settings",{focus:25,short:5,long:15,interval:4,sound:true,speech:false,flash:true});
  var log=store.get("log",[]); // [{mode,start,end}]
  var mode="focus", running=false, phaseEnd=0, remainMs=settings.focus*60000, cycle=0;
  var flashTimer=null, flashOn=false, audio=null, tickTimer=null;
  var C=2*Math.PI*88;
  $("ringFg").style.strokeDasharray=C.toFixed(1);

  function clampInt(v,lo,hi,d){v=parseInt(v,10);if(isNaN(v))return d;return Math.min(hi,Math.max(lo,v));}
  function dur(m){return settings[m]*60000;}
  function todayKey(d){var x=d||new Date();return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate();}
  function persist(){store.set("settings",settings);store.set("log",log.slice(-400));}

  function fmt(ms){
    if(ms<0)ms=0;
    var s=Math.ceil(ms/1000),m=Math.floor(s/60);s=s%60;
    return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
  }
  function render(){
    var total=dur(mode), left=running?Math.max(0,phaseEnd-Date.now()):remainMs;
    left=Math.min(left,total);
    $("timeText").textContent=fmt(left);
    $("phaseName").textContent=MODES[mode];
    var frac=total?left/total:0;
    $("ringFg").style.strokeDashoffset=(C*(1-frac)).toFixed(1);
    $("cycleText").textContent="Cycle "+(mode==="focus"?Math.min(cycle+1,settings.interval):cycle%settings.interval||settings.interval)+" of "+settings.interval;
    $("startBtn").textContent=running?"Pause":"Start";
    document.querySelectorAll(".tabs .btn").forEach(function(b){
      var sel=b.dataset.mode===mode;b.classList.toggle("on",sel);b.setAttribute("aria-selected",sel?"true":"false");});
    $("todayCount").textContent=todayFocus()+" focus today";
  }
  function todayFocus(){
    var k=todayKey(),n=0;
    for(var i=0;i<log.length;i++)if(log[i].mode==="focus"&&todayKey(new Date(log[i].end))===k)n++;
    return n;
  }
  function renderLog(){
    var ul=$("logList");ul.textContent="";
    var k=todayKey(),items=log.filter(function(s){return todayKey(new Date(s.end))===k;}).slice().reverse();
    if(!items.length){
      var li0=document.createElement("li");li0.className="k";li0.textContent="No sessions logged yet today.";ul.appendChild(li0);
    }
    items.forEach(function(s){
      var li=document.createElement("li");
      var a=document.createElement("span");a.textContent=MODES[s.mode];
      var b=document.createElement("span");b.className="k";
      var d=new Date(s.end);
      b.textContent=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+" · "+Math.round((s.end-s.start)/60000)+" min";
      li.appendChild(a);li.appendChild(b);ul.appendChild(li);
    });
  }
  function setMode(m){
    mode=m;
    if(!running)remainMs=dur(m);
    flashStop();render();
  }
  function start(){
    if(running)return;
    ensureAudio();
    var total=dur(mode);
    remainMs=Math.min(remainMs,total);
    phaseEnd=Date.now()+remainMs;
    running=true;flashStop();
    if(tickTimer)clearInterval(tickTimer);
    tickTimer=setInterval(tick,250);
    render();
  }
  function pause(){
    if(!running)return;
    remainMs=Math.max(0,phaseEnd-Date.now());
    running=false;
    if(tickTimer){clearInterval(tickTimer);tickTimer=null;}
    render();
  }
  function reset(){
    pause();remainMs=dur(mode);render();
  }
  function tick(){
    if(!running)return;
    if(Date.now()>=phaseEnd){finish(true);return;}
    render();
  }
  function finish(natural){
    var now=Date.now(), total=dur(mode);
    var startTs=natural?phaseEnd-total:Math.max(now-(total-remainMs),now-total);
    log.push({mode:mode,start:startTs,end:now});
    persist();renderLog();
    if(mode==="focus"){cycle++;}
    var next;
    if(mode!=="focus")next="focus";
    else next=(cycle%settings.interval===0)?"long":"short";
    running=false;
    if(tickTimer){clearInterval(tickTimer);tickTimer=null;}
    mode=next;remainMs=dur(next);
    if(natural){notify(next);}
    render();
  }
  function notify(next){
    if(settings.sound)beep();
    if(settings.speech&&"speechSynthesis" in window){
      try{
        var u=new SpeechSynthesisUtterance(next==="focus"?"Break over, time to focus":"Pomodoro complete, take a break");
        u.rate=1;speechSynthesis.speak(u);
      }catch(e){}
    }
    if(settings.flash)flashStart();
  }
  function ensureAudio(){
    if(audio)return;
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(AC)audio=new AC();
    }catch(e){}
  }
  function beep(){
    ensureAudio();if(!audio)return;
    try{
      if(audio.state==="suspended")audio.resume();
      var t=audio.currentTime;
      [[880,0,.12],[660,.18,.16],[990,.4,.2]].forEach(function(n){
        var o=audio.createOscillator(),g=audio.createGain();
        o.type="sine";o.frequency.value=n[0];
        g.gain.setValueAtTime(.0001,t+n[1]);
        g.gain.exponentialRampToValueAtTime(.25,t+n[1]+.02);
        g.gain.exponentialRampToValueAtTime(.0001,t+n[1]+n[2]);
        o.connect(g);g.connect(audio.destination);
        o.start(t+n[1]);o.stop(t+n[1]+n[2]+.02);
      });
    }catch(e){}
  }
  var baseTitle="Pomodoro Timer";
  function flashStart(){
    flashStop();
    if(document.hasFocus&&!document.hasFocus()){
      flashTimer=setInterval(function(){
        flashOn=!flashOn;
        document.title=flashOn?"⏰ "+baseTitle+" — done!":baseTitle;
      },1000);
      setTimeout(flashStop,20000);
    }
  }
  function flashStop(){
    if(flashTimer){clearInterval(flashTimer);flashTimer=null;}
    flashOn=false;document.title=baseTitle;
  }
  /* settings UI */
  function loadSettingsUI(){
    $("inFocus").value=settings.focus;$("inShort").value=settings.short;
    $("inLong").value=settings.long;$("inInterval").value=settings.interval;
    $("ckSound").checked=!!settings.sound;$("ckSpeech").checked=!!settings.speech;$("ckFlash").checked=!!settings.flash;
  }
  function bindNum(id,key,lo,hi,d){
    $(id).addEventListener("change",function(){
      settings[key]=clampInt($(id).value,lo,hi,d);$(id).value=settings[key];
      if(!running&&id!=="inInterval")remainMs=dur(mode);
      persist();render();
    });
  }
  bindNum("inFocus","focus",1,180,25);bindNum("inShort","short",1,60,5);
  bindNum("inLong","long",1,120,15);bindNum("inInterval","interval",2,12,4);
  $("ckSound").addEventListener("change",function(){settings.sound=$("ckSound").checked;persist();if(settings.sound){ensureAudio();beep();}});
  $("ckSpeech").addEventListener("change",function(){settings.speech=$("ckSpeech").checked;persist();});
  $("ckFlash").addEventListener("change",function(){settings.flash=$("ckFlash").checked;persist();});

  document.querySelectorAll(".tabs .btn").forEach(function(b){
    b.addEventListener("click",function(){pause();setMode(b.dataset.mode);remainMs=dur(mode);render();});
  });
  $("startBtn").addEventListener("click",function(){running?pause():start();});
  $("resetBtn").addEventListener("click",reset);
  $("skipBtn").addEventListener("click",function(){if(running||remainMs<dur(mode))finish(false);else{var t=mode;pause();if(t==="focus")cycle++;mode=(t==="focus"&&cycle%settings.interval===0)?"long":(t==="focus"?"short":"focus");remainMs=dur(mode);render();}});
  var clearArmed=false,clearTimer=null;
  $("clearLogBtn").addEventListener("click",function(){
    if(!clearArmed){clearArmed=true;$("clearLogBtn").textContent="Confirm?";$("logNote").textContent="Click again to clear today's log.";
      clearTimer=setTimeout(function(){clearArmed=false;$("clearLogBtn").textContent="Clear log";$("logNote").textContent="";},3000);return;}
    clearTimeout(clearTimer);clearArmed=false;$("clearLogBtn").textContent="Clear log";$("logNote").textContent="";
    var k=todayKey();log=log.filter(function(s){return todayKey(new Date(s.end))!==k;});
    persist();renderLog();render();
  });
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible"){
      flashStop();
      if(running&&Date.now()>=phaseEnd)finish(true);else render();
    }
  });
  addEventListener("keydown",function(e){
    if(e.target&&/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName))return;
    if(e.code==="Space"){e.preventDefault();running?pause():start();}
  });
  if(!store.persistent){$("footNote").textContent="Session only — data is not persisted inside Nucleus (sandboxed frame). Runs offline.";}
  loadSettingsUI();renderLog();render();
})();
</script>
</body>
</html>
